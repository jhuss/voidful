# Example UEFI + LUKS + ext4 Configuration
# This configuration creates an encrypted system with LUKS2 encryption.
# The EFI partition is unencrypted (required for UEFI boot), but the root
# partition is encrypted with LUKS.
#
# IMPORTANT: Set at least one of LUKS_PASSPHRASE or LUKS_KEYFILE before running.
#   export LUKS_PASSPHRASE="your-secure-passphrase"
#   # OR
#   export LUKS_KEYFILE="/path/to/keyfile.bin"
#   # OR both for passphrase + keyfile fallback (recommended):

# ── Global Settings ──────────────────────────────────────────────────────────


# ISSUE_MESSAGE can be enabled but should not be set.

# ── LUKS Configuration ───────────────────────────────────────────────────────
# OR (recommended for flexibility):
#   export LUKS_PASSPHRASE="your-secure-passphrase"
#   export LUKS_KEYFILE="/path/to/keyfile.bin"
#
# IMPORTANT:
#   - LUKS_PASSPHRASE is a plaintext string (piped via process substitution).
#   - LUKS_KEYFILE is a file path on the live ISO (passed directly to --key-file).
#   - Both can be set simultaneously: the keyfile enables automated boot,
#     the passphrase provides interactive fallback.
#   - The keyfile (if used) must exist and be readable on the live ISO.
#
# For keyfile mode, copy the keyfile to the live ISO before running the installer:
#   cp /path/to/keyfile.bin /root/luks.key
#   export LUKS_KEYFILE="/root/luks.key"

# ── System Configuration ─────────────────────────────────────────────────────

HOSTNAME="voidful-encrypted"
LOCALE="en_US.UTF-8"
KEYMAP="us"
TIMEZONE="America/Argentina/Buenos_Aires"
ROOT_PASS="changeme"             # Override with ROOT_PASS env var for security
CREATE_USER="yes"
USER_LOGIN="user"
USERNAME="Void User"
USER_PASS="changeme"             # Override with USER_PASS env var for security
USER_SHELL="/bin/bash"
USER_GROUPS="wheel,audio,video"
TEXTCONSOLE="0"

# ── Partition Layout ─────────────────────────────────────────────────────────
# IMPORTANT: LUKS requires BOTH partitions:
#   - /boot/efi (vfat) — EFI System Partition for GRUB EFI binary
#   - /boot (ext4)     — Unencrypted partition for kernel + initramfs
# GRUB reads kernel/initramfs from /boot, the initramfs handles LUKS decryption.
#
# EFI System Partition (100MB, vfat) — UNENCRYPTED
#   GRUB EFI binary lives here: EFI/void_grub/grubx64.efi
# Boot Partition (512MB, ext4) — UNENCRYPTED
#   Kernel + initramfs live here: vmlinuz, initramfs
# LUKS-encrypted root partition (rest of disk)

define_partition \
  --mount "/boot/efi" \
  --size "+100M" \
  --fs "vfat" \
  --luks "no"

define_partition \
  --mount "/boot" \
  --size "+512M" \
  --fs "ext4" \
  --luks "no"

define_partition \
  --mount "/" \
  --size "" \
  --fs "ext4" \
  --luks "yes"

# ── Services (Optional) ──────────────────────────────────────────────────────
# dhcpcd for network, sshd for remote access
# ENABLED_SERVICES="dhcpcd,sshd"
SWAP_TYPE="file"              # Swap file inside encrypted root
SWAP_SIZE="4G"

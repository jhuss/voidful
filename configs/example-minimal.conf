# Example Minimal Install Configuration
# This configuration creates a minimal single-partition system with no swap.
# Suitable for containers, servers, or users who want a bare-bones system.

# ── Global Settings ──────────────────────────────────────────────────────────

TARGET_DISK="/dev/sda"           # Target disk (validate with lsblk before running)
TARGET_DIR="/mnt"                # Mount point for root partition
END_ACTION="shutdown"            # shutdown, reboot, script, func
BOOTLOADER="grub"                # "grub" or "none"
SWAP_TYPE="none"                 # No swap (not recommended for systems < 4GB RAM)

# ── System Configuration ─────────────────────────────────────────────────────

HOSTNAME="voidful-minimal"
LOCALE="en_US.UTF-8"
KEYMAP="us"
ROOT_PASS="changeme"             # Override with ROOT_PASS env var for security
CREATE_USER="no"                 # No regular user (container/SSH-only access)
TEXTCONSOLE="0"

# ── Partition Layout ─────────────────────────────────────────────────────────
# Single root partition (entire disk)

define_partition \
  --mount "/" \
  --size "" \
  --fs "ext4" \
  --luks "no"

# ── Additional Packages (Optional) ───────────────────────────────────────────
# Keep the package list minimal for a minimal install
# INSTALL_PACKAGES="vim"

# ── Services (Optional) ──────────────────────────────────────────────────────
# Only essential services
# ENABLED_SERVICES="sshd"

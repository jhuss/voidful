# Example Minimal Install Configuration
# This configuration creates a minimal system with a swap partition.
# Suitable for containers, servers, or users who want a bare-bones system.

# ── Global Settings ──────────────────────────────────────────────────────────

TARGET_DISK="/dev/sda"           # Target disk (validate with lsblk before running)
TARGET_DIR="/mnt"                # Mount point for root partition
END_ACTION="shutdown"            # shutdown, reboot, script, func
BOOTLOADER="grub"                # "grub" or "none"
SWAP_TYPE="partition"            # "partition" or "file"
SWAP_SIZE="4G"

# ── System Configuration ─────────────────────────────────────────────────────

HOSTNAME="voidful-minimal"
LOCALE="en_US.UTF-8"
KEYMAP="us"
TIMEZONE="America/Argentina/Buenos_Aires"
ROOT_PASS="changeme"             # Override with ROOT_PASS env var for security
CREATE_USER="no"                 # No regular user (container/SSH-only access)
# NOTE: CREATE_USER="no" means no regular user account.
# Login as root with the password set in ROOT_PASS above.
TEXTCONSOLE="0"

# ── Partition Layout ─────────────────────────────────────────────────────────
# Root partition (remaining space) + swap partition (injected automatically)

define_partition \
  --mount "/" \
  --size "" \
  --fs "ext4" \
  --luks "no"

# ── Services (Optional) ──────────────────────────────────────────────────────
# Only essential services
# ENABLED_SERVICES="dhcpcd,sshd"

# Example Btrfs with Subvolumes Configuration
# This configuration uses Btrfs with subvolumes (@, @home, @var) for a
# modern, snapshot-friendly filesystem layout.
# Suitable for desktop systems where snapshots and rollback are desired.

# ── Global Settings ──────────────────────────────────────────────────────────

TARGET_DISK="/dev/sda"           # Target disk (validate with lsblk before running)
TARGET_DIR="/mnt"                # Mount point for root partition
END_ACTION="shutdown"            # shutdown, reboot, script, func
BOOTLOADER="grub"                # "grub" or "none"
SWAP_TYPE="file"              # Swap file (btrfs-native, uses truncate + chattr +C)
SWAP_SIZE="4G"

# ── System Configuration ─────────────────────────────────────────────────────

HOSTNAME="voidful-btrfs"
LOCALE="en_US.UTF-8"
KEYMAP="us"
TIMEZONE="America/Argentina/Buenos_Aires"
ROOT_PASS="changeme"             # Override with ROOT_PASS env var for security
CREATE_USER="yes"
USER_LOGIN="user"
USERNAME="Void User"
USER_PASS="changeme"             # Override with USER_PASS env var for security
USER_SHELL="/bin/bash"
USER_GROUPS="wheel,audio,video"
TEXTCONSOLE="0"

# ── Partition Layout ─────────────────────────────────────────────────────────
# EFI System Partition (100MB, vfat)
# Btrfs partition (rest of disk) — subvolumes created after clone

define_partition \
  --mount "/boot/efi" \
  --size "+100M" \
  --fs "vfat" \
  --luks "no"

define_partition \
  --mount "/" \
  --size "" \
  --fs "btrfs" \
  --luks "no"

# ── Services (Optional) ──────────────────────────────────────────────────────
# ENABLED_SERVICES="dhcpcd"

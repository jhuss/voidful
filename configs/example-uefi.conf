# Example UEFI + ext4 Configuration
# This configuration creates a standard UEFI system with ext4 partitions.
# Suitable for most desktop and server installations.

# ── Global Settings ──────────────────────────────────────────────────────────

TARGET_DISK="/dev/sda"           # Target disk (validate with lsblk before running)
TARGET_DIR="/mnt"                # Mount point for root partition
END_ACTION="shutdown"            # shutdown, reboot, script, func
BOOTLOADER="grub"                # "grub" or "none"
SWAP_TYPE="partition"            # "partition" or "file"
SWAP_SIZE="4G"

# ── System Configuration ─────────────────────────────────────────────────────

HOSTNAME="voidful"
LOCALE="en_US.UTF-8"
KEYMAP="us"
TIMEZONE="America/Argentina/Buenos_Aires"
ROOT_PASS="changeme"             # Override with ROOT_PASS env var for security
CREATE_USER="yes"
USER_LOGIN="user"
USERNAME="Void User"
USER_PASS="changeme"             # Override with USER_PASS env var for security
USER_SHELL="/bin/bash"
USER_GROUPS="wheel,audio,video"
TEXTCONSOLE="0"

# ── Network Configuration (Optional) ─────────────────────────────────────────
# Uncomment and fill for static IP or wireless setups
# NETWORK_DEVICE="eth0"
# NETWORK_MODE="dhcp"            # "dhcp", "static", or "wireless"
# For static mode:
# NETWORK_IP="192.168.1.100"
# NETWORK_GATEWAY="192.168.1.1"
# DNS_SERVERS="8.8.8.8,1.1.1.1"

# ── Partition Layout ─────────────────────────────────────────────────────────
# EFI System Partition (100MB, vfat)
# Root partition (rest of disk, ext4)

define_partition \
  --mount "/boot/efi" \
  --size "+100M" \
  --fs "vfat" \
  --luks "no"

define_partition \
  --mount "/" \
  --size "" \
  --fs "ext4" \
  --luks "no"

# ── Services (Optional) ──────────────────────────────────────────────────────
# Uncomment and fill with runit service names to enable
# ENABLED_SERVICES="dhcpcd,sshd"
